{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 100px auto; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); text-align: center;">
    <h2 style="margin-bottom: 25px;"><i class="fas fa-user-shield" style="color: var(--accent);"></i> MFA Required</h2>
    <p style="color: var(--text-secondary); margin-bottom: 30px; font-size: 0.95rem;">Please enter the 6-digit verification code from your authenticator app.</p>
    
    <form method="POST">
        <div style="margin-bottom: 25px; max-width: 200px; margin-left: auto; margin-right: auto;">
            <label style="display: block; margin-bottom: 8px; font-size: 0.85rem;">Verification Token</label>
            <input type="text" name="token" placeholder="000000" required autofocus style="width: 100%; padding: 12px; text-align: center; letter-spacing: 4px; font-size: 1.2rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white;">
        </div>
        <button type="submit" style="width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer;">Verify & Login</button>
    </form>
</div>
{% endblock %}
