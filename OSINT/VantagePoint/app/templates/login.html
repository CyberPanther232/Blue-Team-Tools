{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 100px auto; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
    <h2 style="text-align: center; margin-bottom: 30px;"><i class="fas fa-lock" style="color: var(--accent);"></i> Login</h2>
    <form method="POST">
        <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 8px; font-size: 0.9rem;">Username</label>
            <input type="text" name="username" required style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white;">
        </div>
        <div style="margin-bottom: 25px;">
            <label style="display: block; margin-bottom: 8px; font-size: 0.9rem;">Password</label>
            <input type="password" name="password" required style="width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white;">
        </div>
        <button type="submit" style="width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 8px; color: white; font-weight: 600; cursor: pointer;">Sign In</button>
    </form>
    
    {% if github or authentik %}
    <div style="margin-top: 25px; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px;">
        <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 15px;">Or continue with</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            {% if github %}
            <a href="{{ url_for('github_login') }}" style="flex: 1; padding: 10px; background: #333; border-radius: 8px; color: white; text-decoration: none; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <i class="fab fa-github"></i> GitHub
            </a>
            {% endif %}
            {% if authentik %}
            <a href="{{ url_for('authentik_login') }}" style="flex: 1; padding: 10px; background: #fd4b2d; border-radius: 8px; color: white; text-decoration: none; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <i class="fas fa-shield-alt"></i> Authentik
            </a>
            {% endif %}
        </div>
    </div>
    {% endif %}
    
    {% if allow_registration %}
    <p style="text-align: center; margin-top: 20px; font-size: 0.85rem;">
        Don't have an account? <a href="{{ url_for('register') }}" style="color: var(--accent);">Register here</a>
    </p>
    {% endif %}
</div>
{% endblock %}
